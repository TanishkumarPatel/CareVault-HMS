server:
  port: 4006

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://services-db:5432/ai_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      test-on-borrow: true
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: ${GEMINI_API_URL}

