server:
  port: 4005
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://auth-service-db:5432/db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      test-on-borrow: true
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION} 